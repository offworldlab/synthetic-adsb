version: '3'

networks:
  blah2:
    external: true

services:
  synthetic-adsb:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    image: synthetic-adsb
    ports:
      - "5001:5001"
    networks:
      - blah2
    container_name: synthetic-adsb
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/data/aircraft.json" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
